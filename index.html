<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Vector 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0f;color:#e0e0e0;height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.side{width:300px;background:#12121a;border-left:1px solid #2a2a3a;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
h2{margin:0;text-align:center;font-size:20px;background:linear-gradient(135deg,#00d4ff,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.box{background:#1a1a24;border:1px solid #2a2a3a;border-radius:10px;padding:12px}
.box h3{margin:0 0 10px;font-size:14px;color:#00d4ff}
#g{width:100%;aspect-ratio:1;background:#000;border:2px solid #ff0044;display:block;cursor:crosshair;image-rendering:pixelated;border-radius:6px;transition:border-color .2s}
#picker{margin:0 auto;display:block}
.tools{display:flex;gap:6px;margin-bottom:10px}
.t{flex:1;padding:8px;border:1px solid #2a2a3a;background:#0a0a0f;color:#e0e0e0;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
.t:hover{border-color:#444}
.t.active{border-color:#00d4ff;background:#00d4ff22}
.layer{display:flex;align-items:center;gap:10px;margin:10px 0}
.layer label{font-size:13px;min-width:70px;color:#888}
.layer input{flex:1;accent-color:#00d4ff}
.layer span{color:#00d4ff;font-weight:700;min-width:30px;text-align:center}
.zbtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.zbtns button{flex:1;padding:8px;border:1px solid #2a2a3a;background:#0a0a0f;color:#e0e0e0;border-radius:6px;cursor:pointer;font-size:12px;transition:.2s}
.zbtns button:hover{border-color:#444}
.zbtns button.active{border-color:#00d4ff;background:#00d4ff22;color:#00d4ff}
.btn{width:100%;padding:10px;margin-top:8px;border:none;border-radius:8px;background:#00d4ff;color:#0a0a0f;font-weight:700;cursor:pointer;font-size:14px;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px #00d4ff44}
.btn.gray{background:#2a2a3a;color:#e0e0e0}
.btn.gray:hover{background:#333}
.stats{text-align:center;font-size:12px;color:#666;margin-top:4px}
#view{flex:1;position:relative;min-width:0}
#view canvas{display:block;width:100%;height:100%}
.info{position:absolute;top:12px;left:12px;background:#12121acc;padding:8px 14px;border-radius:8px;font-size:13px;color:#00d4ff;border:1px solid #00d4ff44;backdrop-filter:blur(4px)}
.error{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a24;padding:24px;border-radius:12px;border:1px solid #ff4444;text-align:center;display:none;max-width:80%}
.error h3{color:#ff4444;margin:0 0 8px}
</style>
<base target="_blank">
</head>
<body>
<div class="app">
<div class="side">
<h2>🎨 Pixel→Vector</h2>

<div class="box">
<h3>🎨 دائرة الألوان</h3>
<div id="picker"></div>
</div>

<div class="box">
<h3>🎨 أدوات</h3>
<div class="tools">
<button class="t active" onclick="setTool('draw')">✏️ قلم</button>
<button class="t" onclick="setTool('erase')">🧽 ممحاة</button>
<button class="t" onclick="setTool('fill')">🪣 تعبئة</button>
</div>
</div>

<div class="box">
<h3>📐 الرسم 2D</h3>
<canvas id="g" width="16" height="16"></canvas>

<div class="layer">
<label>الطبقة Z:</label>
<input type="range" id="zlayer" min="0" max="5" value="0" step="1" oninput="setLayer(this.value)">
<span id="zval">0</span>
</div>

<div class="zbtns">
<button class="active" onclick="setLayer(0)">Z0</button>
<button onclick="setLayer(1)">Z1</button>
<button onclick="setLayer(2)">Z2</button>
<button onclick="setLayer(3)">Z3</button>
<button onclick="setLayer(4)">Z4</button>
<button onclick="setLayer(5)">Z5</button>
</div>

<button class="btn gray" onclick="clearLayer()">مسح الطبقة</button>
<button class="btn gray" onclick="clearAll()">مسح الكل</button>
</div>

<div class="box">
<h3>📤 تصدير</h3>
<button class="btn" onclick="exportGLB()">📦 تصدير GLB (Blender)</button>
<button class="btn gray" onclick="exportIMG()">📷 صورة PNG</button>
</div>

<div class="stats">الطبقة <span id="curZ" style="color:#00d4ff">0</span> | بكسلات: <span id="n">0</span></div>
</div>

<div id="view">
<div class="info" id="info">🖌️ اختر طبقة ← ارسم على الشبكة</div>
<div class="error" id="errorBox">
<h3>⚠️ خطأ</h3>
<p id="errorText">...</p>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5/dist/iro.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ─── STATE ───
let currentTool = 'draw';
let currentColor = '#ff0044';
let currentLayer = 0;
let voxels = new Map();
let isDrawing = false;
let scene, camera, renderer, instancedMesh, group;
let colorPicker;

const layerColors = ['#ff0044','#00ff88','#0088ff','#ffcc00','#ff8800','#8800ff'];
const canvas = document.getElementById('g');
const ctx = canvas.getContext('2d');

// ─── ERROR HANDLER ───
function showError(msg) {
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorBox').style.display = 'block';
  console.error(msg);
}

// ─── INIT COLOR PICKER ───
try {
  colorPicker = new iro.ColorPicker("#picker", {
    width: 200,
    color: "#ff0044",
    borderWidth: 2,
    borderColor: "#2a2a3a",
    layout: [
      { component: iro.ui.Wheel, options: { wheelLightness: false } },
      { component: iro.ui.Slider, options: { sliderType: 'value' } },
      { component: iro.ui.Slider, options: { sliderType: 'alpha' } }
    ]
  });
  colorPicker.on('color:change', function(color) {
    currentColor = color.hexString;
  });
} catch (e) {
  showError('فشل تحميل دائرة الألوان: ' + e.message);
}

// ─── INIT THREE.JS ───
function init3D() {
  try {
    const container = document.getElementById('view');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(25, 20, 25);
    camera.lookAt(0, 3, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(10, 20, 10);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.set(2048, 2048);
    scene.add(mainLight);
    scene.add(new THREE.DirectionalLight(0x7c3aed, 0.4).position.set(-10, 10, -10));
    scene.add(new THREE.DirectionalLight(0x00d4ff, 0.3).position.set(0, 10, 10));
    scene.add(new THREE.GridHelper(40, 40, 0x2a2a3a, 0x161622));

    group = new THREE.Group();
    scene.add(group);

    animate();
    window.addEventListener('resize', onResize);
  } catch (e) {
    showError('فشل تهيئة Three.js: ' + e.message);
  }
}

function animate() {
  requestAnimationFrame(animate);
  if (group) group.rotation.y += 0.003;
  if (renderer && scene && camera) renderer.render(scene, camera);
}

function onResize() {
  if (!camera || !renderer) return;
  const container = document.getElementById('view');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

// ─── 2D CANVAS ───
function drawGrid() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 16, 16);
  for (let ix = 0; ix < 16; ix++) {
    for (let iy = 0; iy < 16; iy++) {
      const col = voxels.get(ix + ',' + iy + ',' + currentLayer);
      if (col) {
        ctx.fillStyle = col;
        ctx.fillRect(ix, iy, 1, 1);
      }
    }
  }
  ctx.strokeStyle = '#2a2a3a';
  ctx.lineWidth = 0.05;
  for (let i = 0; i <= 16; i++) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(16, i); ctx.stroke();
  }
}

function getCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scale = 16 / rect.width;
  return [
    Math.floor((e.clientX - rect.left) * scale),
    Math.floor((e.clientY - rect.top) * scale)
  ];
}

canvas.addEventListener('pointerdown', e => { isDrawing = true; paint(e); });
canvas.addEventListener('pointermove', e => { if (isDrawing) paint(e); });
canvas.addEventListener('pointerup', () => { isDrawing = false; });
canvas.addEventListener('pointerleave', () => { isDrawing = false; });

function paint(e) {
  const [cx, cy] = getCoords(e);
  if (cx < 0 || cy < 0 || cx > 15 || cy > 15) return;
  const key = cx + ',' + cy + ',' + currentLayer;
  if (currentTool === 'draw') {
    voxels.set(key, currentColor);
  } else if (currentTool === 'erase') {
    voxels.delete(key);
  } else if (currentTool === 'fill') {
    floodFill(cx, cy, currentLayer, currentColor);
  }
  drawGrid();
  render3D();
  updateStats();
}

function floodFill(sx, sy, sz, targetColor) {
  const startKey = sx + ',' + sy + ',' + sz;
  const startColor = voxels.get(startKey) || '#000000';
  if (startColor === targetColor) return;
  const queue = [[sx, sy]];
  const visited = new Set();
  while (queue.length) {
    const [x, y] = queue.shift();
    const k = x + ',' + y + ',' + sz;
    if (visited.has(k) || x < 0 || y < 0 || x > 15 || y > 15) continue;
    const c = voxels.get(k) || '#000000';
    if (c !== startColor) continue;
    visited.add(k);
    voxels.set(k, targetColor);
    queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
}

// ─── UI CONTROLS ───
window.setLayer = function(z) {
  currentLayer = parseInt(z);
  document.getElementById('zlayer').value = z;
  document.getElementById('zval').textContent = z;
  document.getElementById('curZ').textContent = z;
  canvas.style.borderColor = layerColors[currentLayer];
  document.querySelectorAll('.zbtns button').forEach((b, i) => {
    b.classList.toggle('active', i === currentLayer);
  });
  drawGrid();
  document.getElementById('info').textContent = '🖌️ الطبقة Z=' + currentLayer + ' — ارسم الآن';
};

window.setTool = function(t) {
  currentTool = t;
  const labels = { draw: 'قلم', erase: 'ممحاة', fill: 'تعبئة' };
  document.querySelectorAll('.t').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes(labels[t]));
  });
};

window.clearLayer = function() {
  for (let x = 0; x < 16; x++) {
    for (let y = 0; y < 16; y++) {
      voxels.delete(x + ',' + y + ',' + currentLayer);
    }
  }
  drawGrid();
  render3D();
  updateStats();
};

window.clearAll = function() {
  voxels.clear();
  drawGrid();
  render3D();
  updateStats();
};

// ─── 3D RENDER (VECTOR / SMOOTH) ───
function render3D() {
  if (!group) return;
  if (instancedMesh) {
    group.remove(instancedMesh);
    instancedMesh.dispose();
    instancedMesh = null;
  }
  if (voxels.size === 0) {
    updateStats();
    return;
  }

  // Smooth vector shape: extruded square with bevel
  const shape = new THREE.Shape();
  const s = 0.45;
  shape.moveTo(-s, -s);
  shape.lineTo(s, -s);
  shape.lineTo(s, s);
  shape.lineTo(-s, s);
  shape.lineTo(-s, -s);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 1,
    bevelEnabled: true,
    bevelThickness: 0.08,
    bevelSize: 0.08,
    bevelOffset: 0,
    bevelSegments: 4
  });

  const material = new THREE.MeshStandardMaterial({
    roughness: 0.2,
    metalness: 0.1,
  });

  instancedMesh = new THREE.InstancedMesh(geometry, material, voxels.size);
  instancedMesh.castShadow = true;
  instancedMesh.receiveShadow = true;

  const dummy = new THREE.Object3D();
  const col3 = new THREE.Color();
  let i = 0;

  voxels.forEach((colorStr, key) => {
    const [x, y, z] = key.split(',').map(Number);
    dummy.position.set(x - 7.5, z * 1.1, y - 7.5);
    dummy.rotation.set(Math.PI / 2, 0, 0);
    dummy.scale.set(1, 1, 0.95);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);
    col3.set(colorStr);
    instancedMesh.setColorAt(i, col3);
    i++;
  });

  instancedMesh.instanceMatrix.needsUpdate = true;
  if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
  group.add(instancedMesh);
  updateStats();
}

// ─── EXPORT GLB ───
window.exportGLB = function() {
  if (!group || voxels.size === 0) {
    alert('لا يوجد نموذج للتصدير! ارسم شيئاً أولاً.');
    return;
  }
  try {
    const exporter = new GLTFExporter();
    exporter.parse(
      group,
      function(gltf) {
        const blob = new Blob([gltf], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pixel-vector.glb';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      },
      function(error) {
        showError('خطأ في التصدير: ' + error);
      },
      { binary: true }
    );
  } catch (e) {
    showError('فشل التصدير: ' + e.message);
  }
};

// ─── EXPORT IMAGE ───
window.exportIMG = function() {
  if (!renderer) return;
  renderer.render(scene, camera);
  const link = document.createElement('a');
  link.download = 'pixel-vector-render.png';
  link.href = renderer.domElement.toDataURL('image/png');
  link.click();
};

function updateStats() {
  document.getElementById('n').textContent = voxels.size;
}

// ─── START ───
init3D();
drawGrid();
setLayer(0);
setTool('draw');
</script>
</body>
</html>
